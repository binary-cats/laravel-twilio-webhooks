name: Laravel

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']
        laravel-version: ['8.*', '9.*', '10.*', '11.*', '12.*', '13.*']
        exclude:
          - laravel-version: '13.*'
            php-version: '8.2'
        include:
          - laravel-version: '8.*'
            testbench-version: '^6.0'
          - laravel-version: '9.*'
            testbench-version: '^7.0'
          - laravel-version: '10.*'
            testbench-version: '^8.0'
          - laravel-version: '11.*'
            testbench-version: '^9.0'
          - laravel-version: '12.*'
            testbench-version: '^10.0'
          - laravel-version: '13.*'
            testbench-version: '^11.0'
    
    name: PHP ${{ matrix.php-version }} - Laravel ${{ matrix.laravel-version }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
        coverage: none
    
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-
    
    - name: Install dependencies
      run: |
        composer config --global policy.advisories.block false
        composer require "laravel/framework:${{ matrix.laravel-version }}" "orchestra/testbench:${{ matrix.testbench-version }}" --no-interaction --no-update
        composer update --prefer-dist --no-interaction
    
    - name: Execute tests (Unit and Feature tests) via PHPUnit
      run: vendor/bin/phpunit
